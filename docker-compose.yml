# FusionAuth Deployment - Docker Compose Configuration
#
# Author: Colin Bitterfield
# Email: colin.bitterfield@marketexpress.us
# Updated: 2026-03-30
# Version: 1.1.0
#
# Changelog:
#   1.1.0: Enable TLS on fusionauth-db postgres; add SSL params to JDBC URL (#70)
#
# This configuration deploys FusionAuth authentication infrastructure with PostgreSQL
# for the marketexpress.us B2B marketplace platform.
#
# Architecture:
# - PostgreSQL 17: Authentication database with named volume persistence, TLS enabled
# - FusionAuth 1.53: Identity provider with OIDC/OAuth2 support
# - Bridge network: Isolates inter-container communication
#
# TLS Setup (run once before first deploy or cert rotation):
#   sudo bash /opt/market-express-infra/scripts/setup-postgres-ssl.sh
#
# Usage:
#   cp .env.template .env
#   # Edit .env with actual credentials
#   docker-compose up -d
#
# Requirements: Docker Engine 29.1+ with Compose 2.39+

services:
  # PostgreSQL 17 - Authentication Database
  db:
    image: postgres:17.2
    container_name: fusionauth-db
    restart: unless-stopped

    # TLS: certs generated by /opt/market-express-infra/scripts/setup-postgres-ssl.sh
    # Cert dir: /opt/market-express-infra/ssl/fusionauth-db/
    # postgres:17.2 (Debian) uses UID/GID 999 for the postgres user
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/postgresql/server.crt
      -c ssl_key_file=/etc/ssl/postgresql/server.key

    environment:
      # Database configuration from .env file
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

      # Performance tuning for authentication workload
      POSTGRES_MAX_CONNECTIONS: 200
      POSTGRES_SHARED_BUFFERS: 256MB

    volumes:
      # CRITICAL: Named volume for data persistence (INIT-02)
      # Data survives container recreation - DO NOT change to anonymous volume
      - db_data:/var/lib/postgresql/data
      # TLS certificates (read-only bind mount)
      - /opt/market-express-infra/ssl/fusionauth-db:/etc/ssl/postgresql:ro

    networks:
      - db_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Security: No port exposure - PostgreSQL only accessible via Docker network

  # FusionAuth 1.53 - Identity Provider
  fusionauth:
    image: fusionauth/fusionauth-app:1.53.2
    container_name: fusionauth-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      # Database connection — sslmode=require enforces TLS encryption (#70)
      DATABASE_URL: jdbc:postgresql://db:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=require
      DATABASE_USERNAME: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_ROOT_USERNAME: ${DATABASE_USER}
      DATABASE_ROOT_PASSWORD: ${DATABASE_PASSWORD}

      # FusionAuth runtime configuration (UPDT-02)
      FUSIONAUTH_APP_RUNTIME_MODE: ${FUSIONAUTH_RUNTIME_MODE}
      FUSIONAUTH_APP_SILENT_MODE: ${FUSIONAUTH_SILENT_MODE}

      # Kickstart configuration (INIT-03)
      FUSIONAUTH_APP_KICKSTART_FILE: ${FUSIONAUTH_APP_KICKSTART_FILE}

      # Application secrets for Kickstart variable interpolation (SEC-02)
      FUSIONAUTH_API_KEY: ${FUSIONAUTH_API_KEY}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET}
      VENDOR_CLIENT_SECRET: ${VENDOR_CLIENT_SECRET}
      B2B_CLIENT_SECRET: ${B2B_CLIENT_SECRET}
      B2C_CLIENT_SECRET: ${B2C_CLIENT_SECRET}
      B2G_CLIENT_SECRET: ${B2G_CLIENT_SECRET}

      # Admin user credentials for Kickstart
      FUSIONAUTH_ADMIN_EMAIL: ${FUSIONAUTH_ADMIN_EMAIL}
      FUSIONAUTH_ADMIN_PASSWORD: ${FUSIONAUTH_ADMIN_PASSWORD}
      ADMIN_FUSION_PASSWORD: ${ADMIN_FUSION_PASSWORD}
      ADMIN_EMPLOYEE_PASSWORD: ${ADMIN_EMPLOYEE_PASSWORD}
      ADMIN_B2B_PASSWORD: ${ADMIN_B2B_PASSWORD}
      ADMIN_B2G_PASSWORD: ${ADMIN_B2G_PASSWORD}
      ADMIN_B2C_PASSWORD: ${ADMIN_B2C_PASSWORD}

      # Environment-specific configuration
      ENVIRONMENT: ${ENVIRONMENT}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL}
      FUSIONAUTH_PUBLIC_URL: ${FUSIONAUTH_PUBLIC_URL}

      # Memory configuration
      FUSIONAUTH_APP_MEMORY: 512M

      # Search configuration (PostgreSQL-only mode, no Elasticsearch)
      FUSIONAUTH_APP_SEARCH_TYPE: database

    ports:
      # FusionAuth admin UI and API
      # Bound to loopback. Traefik reaches FusionAuth over the
      # market-express-proxy docker network, not this published port —
      # verified: traefik -> http://fusionauth-app:9011/api/status OK.
      # The only consumer of the HOST port is the deploy health check,
      # which uses http://localhost:9011 and is unaffected.
      # Published on 0.0.0.0 it exposed the FusionAuth admin UI and API
      # directly, bypassing Cloudflare\'s WAF entirely (#142).
      - "127.0.0.1:9011:9011"
    volumes:
      # Kickstart configuration (read-only mount)
      - ./kickstart.json:/usr/local/fusionauth/kickstart/kickstart.json:ro

    networks:
      - db_net

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9011/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

# Networks
networks:
  db_net:
    driver: bridge
    name: fusionauth-network

# Volumes
volumes:
  # Named volume for PostgreSQL data persistence (INIT-02)
  # CRITICAL: This volume preserves user data across container recreations
  db_data:
    name: fusionauth-db-data
