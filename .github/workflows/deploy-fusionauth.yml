# FusionAuth Deploy Workflow
# Applies kickstart.json on fresh installs, deploys docker-compose on all pushes
#
# @version 1.0.0
# @author Colin Bitterfield <colin.bitterfield@marketexpress.us>
# @created 2026-04-05
# @updated 2026-04-05

name: Deploy FusionAuth

# ─────────────────────────────────────────────────────────────────────────────
# ⛔ AUTOMATIC DEPLOY DISABLED — 2026-08-29
# ─────────────────────────────────────────────────────────────────────────────
# FusionAuth moved to the k3s cluster on 2026-08-27. It runs there as a
# Kubernetes Deployment (me-prod/fusionauth) against a restored database, and
# serves auth.marketexpress.us.
#
# This workflow scp'd docker-compose.yml and kickstart.json to the COMPOSE host
# and ran `docker compose up -d`. Neither half applies any more:
#
#   docker-compose.yml  — not how FusionAuth runs. The manifest lives in
#                         market-express-infra/k8s/me-prod/fusionauth.yaml
#   kickstart.json      — provisions an EMPTY instance. The live database has
#                         8 applications and 21 users. Kickstart is skipped
#                         against a populated database, so pushing it achieved
#                         nothing even before the migration — which is exactly
#                         why the live application IDs do not match this file.
#
# Left as workflow_dispatch rather than deleted: it is the only automated path
# to stand up a fresh FusionAuth, which matters for disaster recovery and for a
# scratch environment. See KICKSTART-DRIFT below before trusting it for either.

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Force recreate FusionAuth container (applies kickstart on fresh DB)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy kickstart and compose files to VPS
        run: |
          scp -i ~/.ssh/id_rsa kickstart.json ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/market-express-fusion/kickstart/kickstart.json
          scp -i ~/.ssh/id_rsa docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/market-express-fusion/docker-compose.yml

      - name: Deploy FusionAuth
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REBUILD: ${{ github.event.inputs.rebuild || 'false' }}
        run: |
          ssh -i ~/.ssh/id_rsa ${VPS_USER}@${VPS_HOST} << DEPLOY
            cd /opt/market-express-fusion

            # Write kickstart env vars
            cat > kickstart/.env << 'ENVEOF'
          FA_TENANT_ID=${{ secrets.FA_TENANT_ID }}
          FA_APP_ID_ADMIN=${{ secrets.FA_APP_ID_ADMIN }}
          FA_APP_ID_VENDOR=${{ secrets.FA_APP_ID_VENDOR }}
          FA_APP_ID_B2B=${{ secrets.FA_APP_ID_B2B }}
          FA_APP_ID_B2C=${{ secrets.FA_APP_ID_B2C }}
          FA_APP_ID_B2G=${{ secrets.FA_APP_ID_B2G }}
          FUSIONAUTH_API_KEY=${{ secrets.FUSIONAUTH_API_KEY }}
          FUSIONAUTH_API_KEY_ID=${{ secrets.FUSIONAUTH_API_KEY_ID }}
          FUSIONAUTH_ADMIN_PASSWORD=${{ secrets.FUSIONAUTH_ADMIN_PASSWORD }}
          ADMIN_CLIENT_SECRET=${{ secrets.ADMIN_CLIENT_SECRET }}
          VENDOR_CLIENT_SECRET=${{ secrets.VENDOR_CLIENT_SECRET }}
          B2B_CLIENT_SECRET=${{ secrets.B2B_CLIENT_SECRET }}
          B2C_CLIENT_SECRET=${{ secrets.B2C_CLIENT_SECRET }}
          B2G_CLIENT_SECRET=${{ secrets.B2G_CLIENT_SECRET }}
          ADMIN_FUSION_PASSWORD=${{ secrets.ADMIN_FUSION_PASSWORD }}
          ADMIN_EMPLOYEE_PASSWORD=${{ secrets.ADMIN_EMPLOYEE_PASSWORD }}
          ADMIN_B2B_PASSWORD=${{ secrets.ADMIN_B2B_PASSWORD }}
          ADMIN_B2G_PASSWORD=${{ secrets.ADMIN_B2G_PASSWORD }}
          ADMIN_B2C_PASSWORD=${{ secrets.ADMIN_B2C_PASSWORD }}
          ENVEOF
            chmod 600 kickstart/.env

            if [ "${REBUILD}" = "true" ]; then
              echo "Force recreating FusionAuth container..."
              docker compose stop fusionauth-app
              docker compose rm -f fusionauth-app
            fi

            docker compose up -d

            echo "Waiting for FusionAuth to be healthy..."
            for i in $(seq 1 30); do
              STATUS=$(curl -sf http://localhost:9011/api/status 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)
              if [ "$STATUS" = "OK" ]; then
                echo "FusionAuth is healthy"
                break
              fi
              echo "Attempt $i/30 — waiting..."
              sleep 2
            done
          DEPLOY

      - name: Health check
        run: |
          sleep 5
          curl -sf https://auth.marketexpress.us/api/status | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK' if d.get('status')=='OK' else 'FAIL')"
