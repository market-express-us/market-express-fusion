# Deploy FusionAuth to VPS Dev
#
# @version 2.1.0
# @author Colin Bitterfield <colin@bitterfield.com>
# @created 2026-01-04
# @updated 2026-03-25
#
# Changelog:
# - 2.1.0: Add workflow_dispatch rebuild input; fix v2 secret vars in deploy script
# - 2.0.0: Platform v2 — 5 apps (admin/vendor/b2b/b2c/b2g), groups, new admin users
# - 1.1.0: Fixed verification URL (auth-dev → auth)
# - 1.0.0: Initial version

name: Deploy to VPS Dev

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Destroy data and rebuild from kickstart (deletes all users/apps/groups)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    name: Deploy to 15.204.91.25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_market-express-fusion
          chmod 600 ~/.ssh/id_market-express-fusion
          ssh-keyscan -H 15.204.91.25 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          FUSIONAUTH_ADMIN_EMAIL: ${{ secrets.FUSIONAUTH_ADMIN_EMAIL }}
          FUSIONAUTH_ADMIN_PASSWORD: ${{ secrets.FUSIONAUTH_ADMIN_PASSWORD }}
          FUSIONAUTH_API_KEY: ${{ secrets.FUSIONAUTH_API_KEY }}
          # v2 application client secrets
          ADMIN_CLIENT_SECRET: ${{ secrets.ADMIN_CLIENT_SECRET }}
          VENDOR_CLIENT_SECRET: ${{ secrets.VENDOR_CLIENT_SECRET }}
          B2B_CLIENT_SECRET: ${{ secrets.B2B_CLIENT_SECRET }}
          B2C_CLIENT_SECRET: ${{ secrets.B2C_CLIENT_SECRET }}
          B2G_CLIENT_SECRET: ${{ secrets.B2G_CLIENT_SECRET }}
          # v2 admin user passwords
          ADMIN_FUSION_PASSWORD: ${{ secrets.ADMIN_FUSION_PASSWORD }}
          ADMIN_EMPLOYEE_PASSWORD: ${{ secrets.ADMIN_EMPLOYEE_PASSWORD }}
          ADMIN_B2B_PASSWORD: ${{ secrets.ADMIN_B2B_PASSWORD }}
          ADMIN_B2G_PASSWORD: ${{ secrets.ADMIN_B2G_PASSWORD }}
          ADMIN_B2C_PASSWORD: ${{ secrets.ADMIN_B2C_PASSWORD }}
        run: |
          ssh -i ~/.ssh/id_market-express-fusion fusion-auth@15.204.91.25 "mkdir -p ~/fusionauth"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_market-express-fusion" \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='*.backup.*' \
            --exclude='backup*.sql' \
            ./ fusion-auth@15.204.91.25:~/fusionauth/

          ssh -i ~/.ssh/id_market-express-fusion fusion-auth@15.204.91.25 \
            "cd ~/fusionauth && \
             export DATABASE_PASSWORD='${DATABASE_PASSWORD}' && \
             export FUSIONAUTH_ADMIN_EMAIL='${FUSIONAUTH_ADMIN_EMAIL}' && \
             export FUSIONAUTH_ADMIN_PASSWORD='${FUSIONAUTH_ADMIN_PASSWORD}' && \
             export FUSIONAUTH_API_KEY='${FUSIONAUTH_API_KEY}' && \
             export ADMIN_CLIENT_SECRET='${ADMIN_CLIENT_SECRET}' && \
             export VENDOR_CLIENT_SECRET='${VENDOR_CLIENT_SECRET}' && \
             export B2B_CLIENT_SECRET='${B2B_CLIENT_SECRET}' && \
             export B2C_CLIENT_SECRET='${B2C_CLIENT_SECRET}' && \
             export B2G_CLIENT_SECRET='${B2G_CLIENT_SECRET}' && \
             export ADMIN_FUSION_PASSWORD='${ADMIN_FUSION_PASSWORD}' && \
             export ADMIN_EMPLOYEE_PASSWORD='${ADMIN_EMPLOYEE_PASSWORD}' && \
             export ADMIN_B2B_PASSWORD='${ADMIN_B2B_PASSWORD}' && \
             export ADMIN_B2G_PASSWORD='${ADMIN_B2G_PASSWORD}' && \
             export ADMIN_B2C_PASSWORD='${ADMIN_B2C_PASSWORD}' && \
             if [ '${{ github.event.inputs.rebuild }}' = 'true' ]; then \
               bash scripts/rebuild-vps.sh; \
             else \
               bash scripts/deploy-vps.sh; \
             fi"

      - name: Verify deployment
        run: |
          echo "Waiting 30 seconds for Traefik routing..."
          sleep 30

          if curl --fail --silent https://auth.marketexpress.us/api/status; then
            echo "✓ Deployment verified!"
          else
            echo "WARNING: Could not verify deployment (check manually)"
            exit 1
          fi
