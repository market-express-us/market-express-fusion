# Deploy FusionAuth to VPS Dev
#
# @version 2.2.0
# @author Colin Bitterfield <colin@bitterfield.com>
# @created 2026-01-04
# @updated 2026-04-06
#
# Changelog:
# - 2.2.0: Add FA_TENANT_ID, FA_APP_ID_*, FUSIONAUTH_API_KEY_ID, FA_SMTP_* secrets
#          required for kickstart variable substitution and Mailersend SMTP config
# - 2.1.0: Add workflow_dispatch rebuild input; fix v2 secret vars in deploy script
# - 2.0.0: Platform v2 — 5 apps (admin/vendor/b2b/b2c/b2g), groups, new admin users
# - 1.1.0: Fixed verification URL (auth-dev → auth)
# - 1.0.0: Initial version

name: Deploy to VPS Dev

on:
  # ⛔ AUTOMATIC DEPLOY DISABLED — 2026-08-29.
  #
  # This deployed FusionAuth to 15.204.91.25 on every push to master. That host
  # has served no traffic since the 2026-08-27 cutover; FusionAuth runs on the
  # k3s cluster as me-prod/fusionauth against a restored database.
  #
  # It was still firing: a run at 2026-08-29T14:09 restarted the stale
  # fusionauth-app and fusionauth-db containers on the retired host and reported
  # SUCCESS. Nothing reaches them.
  #
  # Kept dispatchable so a fresh instance can still be stood up — but read the
  # KICKSTART-DRIFT section in README.md first: kickstart.json declares 2
  # applications with placeholder UUIDs while the live instance has 8 with real
  # ones, so it cannot reproduce production.
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Destroy data and rebuild from kickstart (deletes all users/apps/groups)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    name: Deploy to ${{ secrets.VPS_HOST }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_market-express-fusion
          chmod 600 ~/.ssh/id_market-express-fusion
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          FUSIONAUTH_ADMIN_EMAIL: ${{ secrets.FUSIONAUTH_ADMIN_EMAIL }}
          FUSIONAUTH_ADMIN_PASSWORD: ${{ secrets.FUSIONAUTH_ADMIN_PASSWORD }}
          FUSIONAUTH_API_KEY: ${{ secrets.FUSIONAUTH_API_KEY }}
          FUSIONAUTH_API_KEY_ID: ${{ secrets.FUSIONAUTH_API_KEY_ID }}
          # Tenant and application IDs (match live instance)
          FA_TENANT_ID: ${{ secrets.FA_TENANT_ID }}
          FA_APP_ID_ADMIN: ${{ secrets.FA_APP_ID_ADMIN }}
          FA_APP_ID_VENDOR: ${{ secrets.FA_APP_ID_VENDOR }}
          FA_APP_ID_B2B: ${{ secrets.FA_APP_ID_B2B }}
          FA_APP_ID_B2C: ${{ secrets.FA_APP_ID_B2C }}
          FA_APP_ID_B2G: ${{ secrets.FA_APP_ID_B2G }}
          # v2 application client secrets
          ADMIN_CLIENT_SECRET: ${{ secrets.ADMIN_CLIENT_SECRET }}
          VENDOR_CLIENT_SECRET: ${{ secrets.VENDOR_CLIENT_SECRET }}
          B2B_CLIENT_SECRET: ${{ secrets.B2B_CLIENT_SECRET }}
          B2C_CLIENT_SECRET: ${{ secrets.B2C_CLIENT_SECRET }}
          B2G_CLIENT_SECRET: ${{ secrets.B2G_CLIENT_SECRET }}
          # v2 admin user passwords
          ADMIN_FUSION_PASSWORD: ${{ secrets.ADMIN_FUSION_PASSWORD }}
          ADMIN_EMPLOYEE_PASSWORD: ${{ secrets.ADMIN_EMPLOYEE_PASSWORD }}
          ADMIN_B2B_PASSWORD: ${{ secrets.ADMIN_B2B_PASSWORD }}
          ADMIN_B2G_PASSWORD: ${{ secrets.ADMIN_B2G_PASSWORD }}
          ADMIN_B2C_PASSWORD: ${{ secrets.ADMIN_B2C_PASSWORD }}
          # Mailersend SMTP for FusionAuth emails
          FA_SMTP_HOST: ${{ secrets.FA_SMTP_HOST }}
          FA_SMTP_PORT: ${{ secrets.FA_SMTP_PORT }}
          FA_SMTP_USER: ${{ secrets.FA_SMTP_USER }}
          FA_SMTP_PASS: ${{ secrets.FA_SMTP_PASS }}
          FA_SMTP_FROM_EMAIL: ${{ secrets.FA_SMTP_FROM_EMAIL }}
          FA_SMTP_FROM_NAME: ${{ secrets.FA_SMTP_FROM_NAME }}
        run: |
          ssh -i ~/.ssh/id_market-express-fusion fusion-auth@${{ secrets.VPS_HOST }} "mkdir -p ~/fusionauth"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_market-express-fusion" \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='*.backup.*' \
            --exclude='backup*.sql' \
            ./ fusion-auth@${{ secrets.VPS_HOST }}:~/fusionauth/

          ssh -i ~/.ssh/id_market-express-fusion fusion-auth@${{ secrets.VPS_HOST }} \
            "cd ~/fusionauth && \
             export DATABASE_PASSWORD='${DATABASE_PASSWORD}' && \
             export FUSIONAUTH_ADMIN_EMAIL='${FUSIONAUTH_ADMIN_EMAIL}' && \
             export FUSIONAUTH_ADMIN_PASSWORD='${FUSIONAUTH_ADMIN_PASSWORD}' && \
             export FUSIONAUTH_API_KEY='${FUSIONAUTH_API_KEY}' && \
             export FUSIONAUTH_API_KEY_ID='${FUSIONAUTH_API_KEY_ID}' && \
             export FA_TENANT_ID='${FA_TENANT_ID}' && \
             export FA_APP_ID_ADMIN='${FA_APP_ID_ADMIN}' && \
             export FA_APP_ID_VENDOR='${FA_APP_ID_VENDOR}' && \
             export FA_APP_ID_B2B='${FA_APP_ID_B2B}' && \
             export FA_APP_ID_B2C='${FA_APP_ID_B2C}' && \
             export FA_APP_ID_B2G='${FA_APP_ID_B2G}' && \
             export ADMIN_CLIENT_SECRET='${ADMIN_CLIENT_SECRET}' && \
             export VENDOR_CLIENT_SECRET='${VENDOR_CLIENT_SECRET}' && \
             export B2B_CLIENT_SECRET='${B2B_CLIENT_SECRET}' && \
             export B2C_CLIENT_SECRET='${B2C_CLIENT_SECRET}' && \
             export B2G_CLIENT_SECRET='${B2G_CLIENT_SECRET}' && \
             export ADMIN_FUSION_PASSWORD='${ADMIN_FUSION_PASSWORD}' && \
             export ADMIN_EMPLOYEE_PASSWORD='${ADMIN_EMPLOYEE_PASSWORD}' && \
             export ADMIN_B2B_PASSWORD='${ADMIN_B2B_PASSWORD}' && \
             export ADMIN_B2G_PASSWORD='${ADMIN_B2G_PASSWORD}' && \
             export ADMIN_B2C_PASSWORD='${ADMIN_B2C_PASSWORD}' && \
             export FA_SMTP_HOST='${FA_SMTP_HOST}' && \
             export FA_SMTP_PORT='${FA_SMTP_PORT}' && \
             export FA_SMTP_USER='${FA_SMTP_USER}' && \
             export FA_SMTP_PASS='${FA_SMTP_PASS}' && \
             export FA_SMTP_FROM_EMAIL='${FA_SMTP_FROM_EMAIL}' && \
             export FA_SMTP_FROM_NAME='${FA_SMTP_FROM_NAME}' && \
             if [ '${{ github.event.inputs.rebuild }}' = 'true' ]; then \
               bash scripts/rebuild-vps.sh; \
             else \
               bash scripts/deploy-vps.sh; \
             fi"

      - name: Verify deployment
        run: |
          echo "Waiting 30 seconds for Traefik routing..."
          sleep 30

          if curl --fail --silent https://auth.marketexpress.us/api/status; then
            echo "✓ Deployment verified!"
          else
            echo "WARNING: Could not verify deployment (check manually)"
            exit 1
          fi

  # Single source of reconcile logic — see .github/workflows/reconcile-smtp.yml
  reconcile-smtp:
    name: Reconcile FusionAuth SMTP
    needs: deploy
    uses: ./.github/workflows/reconcile-smtp.yml
    secrets: inherit
